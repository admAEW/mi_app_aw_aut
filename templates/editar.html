<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Auto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h1 class="mb-4">Editar Auto</h1>

    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Marca</label>
                <input type="text" class="form-control" name="marca" value="{{ auto.marca }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Modelo</label>
                <input type="text" class="form-control" name="modelo" value="{{ auto.modelo }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Versión</label>
                <input type="text" class="form-control" name="version" value="{{ auto.version }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Año</label>
                <input type="text" class="form-control" name="anio" value="{{ auto.anio }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Kilómetros</label>
                <input type="text" class="form-control" name="km" value="{{ auto.km }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Fecha de compra</label>
                <input type="text" class="form-control" name="fecha_compra" value="{{ auto.fecha_compra }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Condición</label>
                <input type="text" class="form-control" name="condicion_prendado" value="{{ auto.condicion_prendado }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Tipo de compra</label>
                <input type="text" class="form-control" name="tipo_compra" value="{{ auto.tipo_compra }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Costo de compra</label>
                <input type="text" class="form-control" name="costo_compra" value="{{ auto.costo_compra }}">
            </div>
        </div>
        <button type="submit" class="btn btn-success mt-3">Guardar cambios</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Cancelar</a>
    </form>

</body>
</html>
